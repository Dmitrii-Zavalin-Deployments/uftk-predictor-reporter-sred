name: uftk_predictor_reporter_sred.yml

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  code_quality_check:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧹 Run autoflake to remove unused imports
        run: |
          autoflake --in-place --recursive --remove-unused-variables --remove-all-unused-imports src

      - name: 💀 Run vulture to find dead code
        run: |
          vulture src || echo "⚠️ Vulture found unused code — review manually if needed"

      - name: 🚀 Commit autoflake changes
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: auto-clean unused imports & variables"
            git notes add -m "robot: true"
            git push origin HEAD
            git push origin refs/notes/* || true
          else
            echo "No autoflake changes to commit."
          fi

  uftk_predictor_reporter_sred:
    needs: code_quality_check
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENABLE_RULE_DEBUG: true
      WORKING_DIR: ${{ github.workspace }}/data/testing-input-output

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v3

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🧱 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y

      - name: 🐍 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Unit Tests with Coverage
        run: |
          echo "🔍 Running all unit tests with pytest and coverage..."
          PYTHONPATH=src pytest tests/ --verbose --cov=src --cov-report=term-missing
          echo "✅ Unit tests and code coverage check completed."

      - name: 📁 Ensure working directory exists
        run: mkdir -p "$WORKING_DIR"

      - name: ☁️ Download input files from Dropbox
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          chmod +x src/download_from_dropbox.sh
          src/download_from_dropbox.sh
      
      - name: 🔧 Run Universal Field Toolkit Predictor‑Reporter
        run: python3 src/universal_field_toolkit_predictor_reporter_sred.py

      - name: ☁️ Upload outputs to Dropbox
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          chmod +x src/upload_to_dropbox.sh
          src/upload_to_dropbox.sh

      - name: 📝 Log trigger & push
        if: always()
        run: |
          echo "$(date '+%Y-%m-%d %H:%M:%S'): Predictor‑Reporter triggered by '${{ github.actor }}' via '${{ github.event_name }}'" >> trigger.txt

          git add trigger.txt

          if ! git diff --cached --quiet; then
            git commit -m "🤖 robot: Predictor‑Reporter trigger log"
            git notes add -m "robot: true"
            git push origin main
            git push origin refs/notes/* || true
          else
            echo "No new logs or errors to commit."
          fi